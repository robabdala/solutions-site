<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>That 1 Guy Solutions</title>
    
    <style>
        /* Base page styling to match your dark logo texture theme */
        body {
            background-color: #121212; /* Dark matte charcoal background */
            color: #e0e0e0;            /* Soft silver/white text for readability */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Styles the header container box */
        .site-header {
            background-color: #1a1a1a;   /* Slightly lighter dark grey for contrast */
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid #c21807; /* Metallic crimson red border line matching your logo font */
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5); /* Adds a premium depth shadow below header */
        }

        /* Controls the size and constraints of your logo image */
        .header-logo {
            max-height: 140px; /* Restricts height so it stays crisp and doesn't overwhelm screens */
            width: auto;       /* Maintains perfect aspect ratio proportions */
            display: inline-block;
        }

        /* Styles the main content layout area */
        .main-content {
            padding: 50px 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Premium red headline styling */
        h1 {
            color: #d32f2f; /* Deep vibrant red matching "Solutions" */
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Silver paragraph description styling */
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #b0bec5; /* Silver-grey tone matching the "THAT 1 GUY" text */
        }
    </style>
</head>
<body>

    <!-- HEADER SECTION WITH YOUR EXACT FILENAME LOGO -->
    <header class="site-header">
        <img src="Logo.png.jpg" alt="That 1 Guy Solutions Logo" class="header-logo">
    </header>

    <!-- MAIN CONTENT SECTION -->
    <main class="main-content">
        <h1>Welcome to That 1 Guy Solutions</h1>
        <p>Your custom business website content goes right here. You can edit this text anytime to describe your tailored services, project details, or company background!</p>
    </main>

</body>
</html>
